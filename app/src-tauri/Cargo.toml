[package]
name = "mlmail"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mlmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-agent = { git = "https://github.com/nitra/tauri-components" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form"] }
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt", "sync", "process"] }
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
log = "0.4"
thiserror = "2"
dotenvy = "0.15.7"
regex = "1"
html-escape = "0.2"
encoding_rs = "0.8"
tauri-plugin-mcp-bridge = "0.11.2"
tauri-plugin-process = "2.3.1"
wasmtime = { version = "=48.0.3", features = ["component-model", "component-model-async"] }
wasmtime-wasi = { version = "=48.0.3", default-features = false, features = ["p2"] }
n-plugin-compatibility = { version = "=0.2.1", registry = "crates-7n" }
n-plugin-oci = { version = "=0.2.1", registry = "crates-7n" }
n-plugin-package = { version = "=0.2.1", registry = "crates-7n" }
n-plugin-runtime = { version = "=0.2.1", registry = "crates-7n" }
n-plugin-wkg = { version = "=0.2.1", registry = "crates-7n" }
anyhow = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
# Explicit pin for the current local-provider implementation used by
# app/src-tauri/src/llm.rs. `tauri-plugin-agent` keeps its own transitive
# llm-lib pin, so Cargo resolves both versions until that plugin updates.
llm-lib = { git = "https://github.com/nitra/7n-rules.git", tag = "llm-lib-v0.2.4", package = "llm-lib" }

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tauri = { version = "2", features = ["test"] }
tempfile = "3"
wat = "1"
