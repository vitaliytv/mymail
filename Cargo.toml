[workspace]
resolver = "2"
members = [
  "app/src-tauri",
  "app/src-tauri/plugins/booking-finder",
  "app/src-tauri/plugins/draft-helper",
  "xtask",
]

[profile.release]
# Cargo defaults for lto/codegen-units: on an M5 a release rebuild after an app change takes 38 s
# instead of 2 min 57 s (thin LTO + 1 codegen unit), at +16% binary size (45.0 vs 38.7 MB).
strip = "symbols"
