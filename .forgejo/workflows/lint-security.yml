name: Lint Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ forgejo.ref }}-${{ forgejo.workflow }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      # trufflehog@main mounts the checkout at /tmp. The ARM64 runner's action
      # container has a read-only /tmp, so use a Docker tmpfs for the scanner's
      # clone scratch space while keeping the checkout read-only.
      - name: Scan Git history for secrets
        run: |
          docker run --rm \
            --volume ".:/repo:ro" \
            --tmpfs /tmp:rw \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///repo \
            --fail \
            --no-update \
            --results=verified,unknown
