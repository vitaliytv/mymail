name: Lint Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ forgejo.ref }}-${{ forgejo.workflow }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      # trufflehog comes with the runner image and scans inside the job container: `docker run`
      # talks to the podman sidecar, which cannot see this job's checkout. /tmp may be read-only
      # on the ARM64 runners, so the scanner's scratch space lives in runner.temp.
      - name: Scan Git history for secrets
        env:
          TMPDIR: ${{ runner.temp }}
        run: >-
          trufflehog git file://.
          --fail
          --no-update
          --exclude-paths .trufflehog-exclude
          --results=verified,unknown
