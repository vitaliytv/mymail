# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release desktop

on:
  push:
    tags:
      - "v*"

  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-desktop:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write # OIDC-токен для автентифікації в Infisical
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun-deps

      - name: Create or reuse GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "mlmail $GITHUB_REF_NAME" --generate-notes
          fi
          echo "release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[cache-poisoning]
        with:
          workspaces: . -> target
      - name: Sync app version from tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const f='app/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')" "$VER"
          echo "tauri.conf.json version → $VER"

      - name: Fetch Apple signing secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          domain: "https://secret.7n.ai"
          project-slug: "vitaliytv-kfse"
          identity-id: "53691c96-17d9-4389-b078-0f77073809ab"
          env-slug: "main"
          secret-path: "/apple"

      - name: Fetch updater signing key from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          domain: "https://secret.7n.ai"
          project-slug: "vitaliytv-kfse"
          identity-id: "53691c96-17d9-4389-b078-0f77073809ab"
          env-slug: "main"
          secret-path: "/updater"

      - name: Build and upload DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ env.APPLE_ID }}
          APPLE_PASSWORD: ${{ env.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: app
          releaseId: ${{ steps.release.outputs.release_id }}
          args: --target universal-apple-darwin
